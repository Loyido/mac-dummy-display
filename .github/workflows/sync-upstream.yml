name: Sync Upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch that keeps the custom Retina profiles"
        required: false
        default: "retina-device-profiles"
      upstream_branch:
        description: "Upstream branch to merge"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into custom branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'Loyido/mac-dummy-display'
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'retina-device-profiles' }}
      UPSTREAM_REPO: patrikviktor/mac-dummy-display
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
      SYNC_BRANCH: sync/upstream-main
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git fetch origin "${TARGET_BRANCH}"

      - name: Merge upstream into sync branch
        id: merge
        run: |
          set -euo pipefail
          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No new upstream commits to merge."
            exit 0
          fi

          git merge --no-ff "upstream/${UPSTREAM_BRANCH}" \
            -m "Merge upstream ${UPSTREAM_BRANCH} into ${TARGET_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Open or update pull request
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          cat > "${body_file}" <<'BODY'
          This PR was created automatically to bring the latest upstream `patrikviktor/mac-dummy-display` changes into `retina-device-profiles`.

          Please review the Swift display-mode changes carefully before merging. The macOS build workflow will attach a fresh `DummyDisplay.app.zip` artifact when the merge is buildable.
          BODY

          if gh pr view "${SYNC_BRANCH}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${SYNC_BRANCH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Sync upstream mac-dummy-display" \
              --body-file "${body_file}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "Sync upstream mac-dummy-display" \
              --body-file "${body_file}"
          fi
